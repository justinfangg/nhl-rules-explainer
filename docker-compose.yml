services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nhl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nhl}
      POSTGRES_DB: ${POSTGRES_DB:-nhl_rules}
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
